# Model routing policy. Hot-reloaded by the agent host; Glass Box writes here
# via POST /api/routing.
#
# Model ids below are PLACEHOLDERS. Replace with the exact ids from the
# Token Factory console (Step 1 of the runbook) before any real call.
# Never hardcode a model id in agent code — always route through complete().

plan:      "TODO/nemotron-3-ultra"     # daily planning pass, nightly synthesis
execute:   "TODO/nemotron-3-super"     # agent execution — the default tier
summarize: "TODO/nemotron-3-nano"      # activity feed, classification

# Cheap-dev override: set all three to the nano id while building, so debug
# loops do not burn Super/Ultra credits.
