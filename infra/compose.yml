# Deployment for the Nebius AI Cloud VM.
#
# What is NOT here, deliberately: the NemoClaw sandboxes. Those are created and
# torn down by the agent host through the nemoclaw CLI, not by compose. The
# host is the only thing that touches that CLI, and putting sandboxes here
# would mean two owners of the same lifecycle.
#
# Bring up with:  docker compose -f infra/compose.yml up -d
# The host needs the nemoclaw binary and the Docker socket, so it runs with
# host networking and a bind mount rather than in a network namespace of its
# own — it is the supervisor, not one of the supervised.

name: lifeos

services:
  host:
    build:
      context: ..
      dockerfile: infra/host.Dockerfile
    container_name: lifeos-host
    restart: unless-stopped
    network_mode: host
    environment:
      HOST_BIND: 127.0.0.1        # Caddy terminates TLS in front
      HOST_PORT: "8000"
      DEMO: ${DEMO:-false}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:?set it in infra/.env}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:?from the Token Factory console}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      GLASSBOX_ORIGINS: ${GLASSBOX_ORIGINS:-https://lifeos.example}
    volumes:
      - ../data:/app/data                        # event log, replay, grounding
      - ../infra/policies:/app/infra/policies    # egress allowlists
      - /var/run/docker.sock:/var/run/docker.sock  # OpenShell needs the runtime
      - /usr/local/bin/nemoclaw:/usr/local/bin/nemoclaw:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  glassbox:
    build:
      context: ../apps/glassbox
      dockerfile: ../../infra/glassbox.Dockerfile
      args:
        # Baked at build time — Next inlines NEXT_PUBLIC_* into the bundle.
        NEXT_PUBLIC_HOST_URL: ${PUBLIC_HOST_URL:?the URL a browser reaches the host on}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:?wss:// URL for the event stream}
    container_name: lifeos-glassbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      host:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: lifeos-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
